<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Math Shooter: Tactical Volley Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; cursor: crosshair; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffcc; font-size: 24px; pointer-events: none; text-shadow: 0 0 15px #00ffcc; font-weight: bold; }
        #game-over { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; display: none; background: rgba(0,0,0,0.95); color: #fff;
            padding: 50px; border: 4px solid #00ffcc; border-radius: 20px; box-shadow: 0 0 30px #00ffcc; z-index: 10;
        }
        button { background: #00ffcc; border: none; padding: 15px 30px; font-size: 20px; color: #000; cursor: pointer; border-radius: 5px; margin-top: 20px; font-weight: bold; }
        #start-msg { position: absolute; width: 100%; text-align: center; top: 50%; color: #00ffcc; font-size: 30px; z-index: 5; }
    </style>
</head>
<body>

<div id="start-msg">CLICK TO ENGAGE VOLLEY SYSTEMS<br><small>Pattern: Center → Both Sides</small></div>
<div id="ui">SCORE: <span id="score">0</span> | LIVES: <span id="lives">3</span></div>
<div id="game-over">
    <h1>PILOT DOWN</h1>
    <p>FINAL SCORE: <span id="final-score">0</span></p>
    <button onclick="location.reload()">RE-DEPLOY</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// --- AUDIO ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'laser') {
        osc.type = 'sawtooth'; 
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'explosion') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'correct') {
        osc.type = 'sine'; 
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'lifeup') {
        [523, 659, 783, 1046].forEach((f, i) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(f, audioCtx.currentTime + i*0.1);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime + i*0.1);
            o.start(audioCtx.currentTime + i*0.1); o.stop(audioCtx.currentTime + i*0.1 + 0.2);
        });
    } else if (type === 'error') {
        osc.type = 'triangle'; 
        osc.frequency.setValueAtTime(110, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    }
}

// --- SETUP ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();
let score = 0, lives = 3, isGameOver = false, blinkTimer = 0;
let dropPityCounter = 0;
let firingStep = 0; // State for volley sequence

const enemies = [], projectiles = [], prizes = [], particles = [], floatingTexts = [];

scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 15, 10);
scene.add(sun);

// --- SHIP MODEL ---
const shipMat = new THREE.MeshPhongMaterial({ color: 0x00d2ff, emissive: 0x000000 });
function createPlayerShip() {
    const group = new THREE.Group();
    const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.35, 2, 8), shipMat);
    fuse.rotation.x = Math.PI/2;
    const wings = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.08, 0.8), shipMat);
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.6, 0.4), shipMat);
    tail.position.set(0, 0.3, -0.6);
    const cMat = new THREE.MeshPhongMaterial({color:0x444444});
    const lG = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.7), cMat);
    lG.rotation.x = Math.PI/2; lG.position.set(-1.1, -0.05, 0.3);
    const rG = lG.clone(); rG.position.x = 1.1;
    const mG = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.9), cMat);
    mG.rotation.x = Math.PI/2; mG.position.set(0, 0.15, 0.5);
    group.add(fuse, wings, tail, lG, rG, mG);
    return group;
}
const ship = createPlayerShip();
ship.position.set(0, 0, -12);
scene.add(ship);

// --- MATH LOGIC ---
function generateMath() {
    const isCorrect = Math.random() < 0.5;
    const type = Math.floor(Math.random() * 3);
    if (type === 0) {
        const a = Math.floor(Math.random()*85)+10, b = Math.floor(Math.random()*15)+5;
        const res = a + b; return { text: `${a} + ${b} = ${isCorrect ? res : res+3}`, correct: isCorrect };
    } else if (type === 1) {
        const a = Math.floor(Math.random()*11)+2, b = Math.floor(Math.random()*11)+2;
        const prod = a * b; return { text: `${prod} : ${b} = ${isCorrect ? a : a+1}`, correct: isCorrect };
    } else {
        const d = Math.floor(Math.random()*6)+4, n1 = 1, n2 = 1;
        return { text: `${n1}/${d} + ${n2}/${d} = ${isCorrect ? (n1+n2) : (n1+n2+1)}/${d}`, correct: isCorrect };
    }
}

function spawnPrize(pos) {
    const math = generateMath();
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 512; canvas.height = 128;
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0,0,512,128);
    ctx.font = 'bold 48px Arial'; ctx.fillStyle = '#00ffcc'; ctx.textAlign = 'center';
    ctx.fillText(math.text, 256, 82);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
    sprite.scale.set(4, 1, 1); sprite.position.copy(pos);
    prizes.push({ sprite, math }); scene.add(sprite);
}

// --- ENGINE ---
function animate() {
    if (isGameOver) return;
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    if (blinkTimer > 0) {
        blinkTimer -= dt;
        shipMat.emissive.setHex(Math.sin(Date.now() * 0.03) > 0 ? 0x00ffcc : 0x000000);
        if (blinkTimer <= 0) shipMat.emissive.setHex(0x000000);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i]; en.position.y -= 3.5 * dt;
        if (en.position.distanceTo(ship.position) < 1.4) { createExplosion(ship.position, 0xff0000); handleHit(); scene.remove(en); enemies.splice(i, 1); continue; }
        for (let pi = projectiles.length - 1; pi >= 0; pi--) {
            if (projectiles[pi].position.distanceTo(en.position) < 0.9) {
                createExplosion(en.position, 0xffaa00); dropPityCounter++;
                if (Math.random() < 0.25 || dropPityCounter >= 4) { spawnPrize(en.position); dropPityCounter = 0; }
                scene.remove(en); enemies.splice(i, 1); scene.remove(projectiles[pi]); projectiles.splice(pi, 1);
                break;
            }
        }
        if (en && en.position.y < -12) { scene.remove(en); enemies.splice(i, 1); }
    }

    for (let i = prizes.length - 1; i >= 0; i--) {
        const pr = prizes[i]; pr.sprite.position.y -= 2.2 * dt;
        if (pr.sprite.position.distanceTo(ship.position) < 1.6) {
            if (pr.math.correct) { addScore(100, pr.sprite.position); playSound('correct'); blinkTimer = 1.0; }
            else { playSound('error'); createExplosion(ship.position, 0xff0000); handleHit(); }
            scene.remove(pr.sprite); prizes.splice(i, 1); continue;
        }
        for (let pi = projectiles.length - 1; pi >= 0; pi--) {
            if (projectiles[pi].position.distanceTo(pr.sprite.position) < 1.2) {
                if (!pr.math.correct) {
                    addScore(100, pr.sprite.position); playSound('correct'); createExplosion(pr.sprite.position, 0x00ffcc);
                } else {
                    playSound('error'); createExplosion(ship.position, 0xff0000); handleHit(); 
                }
                scene.remove(projectiles[pi]); projectiles.splice(pi, 1);
                scene.remove(pr.sprite); prizes.splice(i, 1);
                break;
            }
        }
    }

    floatingTexts.forEach((ft, idx) => {
        ft.sprite.position.x += (-12 - ft.sprite.position.x) * 0.05; ft.sprite.position.y += (8 - ft.sprite.position.y) * 0.05;
        ft.life -= 0.02; ft.sprite.material.opacity = ft.life;
        if (ft.life <= 0) { scene.remove(ft.sprite); floatingTexts.splice(idx, 1); }
    });
    particles.forEach((p, idx) => { p.position.add(p.userData.vel); p.userData.life -= 0.025; p.material.opacity = p.userData.life; if (p.userData.life <= 0) { scene.remove(p); particles.splice(idx, 1); } });
    projectiles.forEach((p, idx) => { p.position.y += 20 * dt; if (p.position.y > 20) { scene.remove(p); projectiles.splice(idx, 1); } });

    renderer.render(scene, camera);
}

function addScore(amount, pos) {
    const oldScore = score; score += amount;
    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
    canvas.width = 256; canvas.height = 128; ctx.font = 'bold 80px Arial'; ctx.fillStyle = '#ffff00'; ctx.textAlign = 'center'; ctx.fillText('+100', 128, 80);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
    sprite.position.copy(pos); sprite.scale.set(2, 1, 1); scene.add(sprite);
    floatingTexts.push({ sprite, life: 1.0 });
    updateUI();
    if (Math.floor(score/2000) > Math.floor(oldScore/2000)) { lives++; playSound('lifeup'); updateUI(); }
}

function handleHit() { lives--; updateUI(); if (lives <= 0) { isGameOver = true; document.getElementById('game-over').style.display = 'block'; document.getElementById('final-score').innerText = score; } }
function updateUI() { document.getElementById('score').innerText = score; document.getElementById('lives').innerText = lives; }

function createExplosion(pos, col) { 
    playSound('explosion'); 
    for (let i = 0; i < 20; i++) { 
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshBasicMaterial({ color: col, transparent: true })); 
        p.position.copy(pos); 
        p.userData = { vel: new THREE.Vector3((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5), life: 1.0 }; 
        scene.add(p); particles.push(p); 
    } 
}

// --- VOLLEY FIRING SYSTEM ---
function createProjectile(offsetX, offsetY) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.9), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
    p.position.copy(ship.position);
    p.position.x += offsetX;
    p.position.y += offsetY;
    projectiles.push(p);
    scene.add(p);
}

window.addEventListener('mousedown', () => {
    if (document.getElementById('start-msg')) document.getElementById('start-msg').remove();
    if (isGameOver) return;
    playSound('laser');
    
    if (firingStep === 0) {
        // Step 1: Center Only
        createProjectile(0, 0.15);
    } else {
        // Step 2: Both Side Cannons
        createProjectile(-1.1, -0.05); // Left
        createProjectile(1.1, -0.05);  // Right
    }

    // Toggle Step
    firingStep = (firingStep + 1) % 2;
});

window.addEventListener('mousemove', (e) => {
    ship.position.x = ((e.clientX / window.innerWidth) * 2 - 1) * 11;
    ship.position.y = (-(e.clientY / window.innerHeight) * 2 + 1) * 7;
    ship.rotation.z = -ship.position.x * 0.04;
    ship.rotation.x = -ship.position.y * 0.05;
});

function spawnEnemy() {
    if (isGameOver) return;
    const en = new THREE.Group(); en.add(new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 8), new THREE.MeshPhongMaterial({color: 0xff4444})));
    en.position.set(THREE.MathUtils.randFloatSpread(18), 12, -12); enemies.push(en); scene.add(en);
    setTimeout(spawnEnemy, 1400);
}
spawnEnemy(); animate();
</script>
</body>
</html>
